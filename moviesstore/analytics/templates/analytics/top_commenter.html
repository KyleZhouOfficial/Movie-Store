{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <h2>Top Commenter</h2>
    <hr />
    {% if template_data.top_users %}
    <table class="table table-striped">
      <thead>
        <tr><th>User</th><th>Comments posted</th></tr>
      </thead>
      <tbody>
        {% for u in template_data.top_users %}
        <tr><td>{{ u.username }}</td><td>{{ u.comments_posted }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p>No comments yet.</p>
    {% endif %}
  </div>
</div>
{% endblock content %}
