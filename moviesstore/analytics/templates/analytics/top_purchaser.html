{% extends 'base.html' %}
{% block content %}
<div class="p-3">
    <div class = "container">
        <h2>Top Purchaser</h2>
        <hr />
        {% if template_data.top_users %}
        <table class="table table-striped">
            <thead>
                <tr><th>User</th><th>Movies purchased</th></tr>
            </thead>
            <tbody>
                {% for u in template_data.top_users %}
                <tr><td>{{ u.username }}</td><td> {{u.movies_purchased}}</td></tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>No purchases yet.</p>
        {% endif %}
    </div>
</div>
{% endblock content %}
